name: Self-Healing Pricing Monitor

on:
  schedule:
    - cron: "0 9 * * *" # daily, 9am UTC
  workflow_dispatch: {} # manual "Run workflow" button for demos

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Persists api/db/flankwatch.db across runs so "last known good"
      # comparisons (record-count drop, schema drift) have real history
      # to check against, instead of every run looking like the first.
      - name: Restore monitor database
        uses: actions/cache@v4
        with:
          path: api/db/flankwatch.db
          key: flankwatch-db-${{ github.run_id }}
          restore-keys: |
            flankwatch-db-

      # Requires a Bright Data API key (not the browser OAuth login) —
      # Bright Data dashboard -> Settings -> API key, stored as the repo
      # secret BRIGHT_DATA_API_KEY.
      - name: Authenticate Bright Data CLI
        run: npx -p @brightdata/cli bdata login -k "${{ secrets.BRIGHT_DATA_API_KEY }}"

      - name: Run monitor (auto-heals + auto-approves on its own if degraded)
        run: node scripts/ci-monitor.js
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
